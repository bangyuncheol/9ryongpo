<text x="74" y="272" font-size="13" font-weight="600" text-anchor="start">collectors/ 수집</text>
<rect x="74" y="282" width="322" height="24" rx="4" fill="none" stroke="#6b7280" stroke-width="0.8"/>
<text x="84" y="298" font-size="11" font-weight="600" text-anchor="start">fleet.py</text>
<text x="147.6" y="298" font-size="11" fill="#6b7280" text-anchor="start">명부 → 어업종류(표지판 정규식)·톤수</text>
<rect x="74" y="312" width="322" height="24" rx="4" fill="none" stroke="#6b7280" stroke-width="0.8"/>
<text x="84" y="328" font-size="11" font-weight="600" text-anchor="start">traffic.py</text>
<text x="162.0" y="328" font-size="11" fill="#6b7280" text-anchor="start">센서3 교통량·혼잡율 실시간 + 5분 캐시</text>
<rect x="74" y="342" width="322" height="24" rx="4" fill="none" stroke="#6b7280" stroke-width="0.8"/>
<text x="84" y="358" font-size="11" font-weight="600" text-anchor="start">auction.py</text>
<text x="162.0" y="358" font-size="11" fill="#6b7280" text-anchor="start">56개월 CSV → 월·위판장·업종·어종 집계</text>
<rect x="74" y="372" width="322" height="24" rx="4" fill="none" stroke="#6b7280" stroke-width="0.8"/>
<text x="84" y="388" font-size="11" font-weight="600" text-anchor="start">scripts/fetch_auction.py</text>
<text x="262.8" y="388" font-size="11" fill="#6b7280" text-anchor="start">새 달 받기(맥·윈도우)</text>
<rect x="425" y="250" width="350" height="170" rx="6" fill="none" stroke="currentColor" stroke-width="1"/>
<text x="439" y="272" font-size="13" font-weight="600" text-anchor="start">feed/ 선박 위치 피드</text>
<text x="761" y="272" font-size="11" fill="#6b7280" text-anchor="end">FEED = live | sim</text>
<rect x="439" y="282" width="322" height="24" rx="4" fill="none" stroke="#b9541a" stroke-width="0.8"/>
<text x="449" y="298" font-size="11" font-weight="600" text-anchor="start">live.py</text>
<text x="505.4" y="298" font-size="11" fill="#6b7280" text-anchor="start">E-UM 10분 · 24h 미갱신이면 예보 중지</text>
<rect x="439" y="312" width="322" height="24" rx="4" fill="none" stroke="#6b7280" stroke-width="0.8"/>
<text x="449" y="328" font-size="11" font-weight="600" text-anchor="start">sim.py</text>
<text x="498.2" y="328" font-size="11" fill="#6b7280" text-anchor="start">대본 6척 + 실좌표 44척(시드 고정)</text>
<rect x="439" y="342" width="322" height="24" rx="4" fill="none" stroke="#6b7280" stroke-width="0.8"/>
<text x="449" y="358" font-size="11" font-weight="600" text-anchor="start">clock.py</text>
<text x="512.6" y="358" font-size="11" fill="#6b7280" text-anchor="start">가상 시계: 재생·배속·되감기</text>
<text x="439" y="392" font-size="10" fill="#6b7280" text-anchor="start">가짜는 '배의 움직임'뿐. 같은 스키마로 ships_pos에 기록</text>
<rect x="790" y="250" width="350" height="170" rx="6" fill="none" stroke="currentColor" stroke-width="1"/>
<text x="804" y="272" font-size="13" font-weight="600" text-anchor="start">rules/ 계산 (결정론)</text>
<rect x="804" y="282" width="322" height="24" rx="4" fill="none" stroke="#6b7280" stroke-width="0.8"/>
<text x="814" y="298" font-size="11" font-weight="600" text-anchor="start">arrival.py</text>
<text x="892.0" y="298" font-size="11" fill="#6b7280" text-anchor="start">입항 판정(15km·2kn·35°·거리 감소)·ETA</text>
<rect x="804" y="312" width="322" height="24" rx="4" fill="none" stroke="#6b7280" stroke-width="0.8"/>
<text x="814" y="328" font-size="11" font-weight="600" text-anchor="start">species.py</text>
<text x="892.0" y="328" font-size="11" fill="#6b7280" text-anchor="start">같은 달 여러 해 평균 · 해마다 바뀌는 업종 제외</text>
<rect x="804" y="342" width="322" height="24" rx="4" fill="none" stroke="#6b7280" stroke-width="0.8"/>
<text x="814" y="358" font-size="11" font-weight="600" text-anchor="start">visit.py</text>
<text x="877.6" y="358" font-size="11" fill="#6b7280" text-anchor="start">지금 교통 + 경매 시각(기본 09:00) 권장</text>
<rect x="804" y="372" width="322" height="24" rx="4" fill="none" stroke="#6b7280" stroke-width="0.8"/>
<text x="814" y="388" font-size="11" font-weight="600" text-anchor="start">brief.py</text>
<text x="877.6" y="388" font-size="11" fill="#6b7280" text-anchor="start">알림 문장: LLM → 숫자 검증 실패 시 템플릿</text>
<rect x="60" y="436" width="350" height="150" rx="6" fill="none" stroke="currentColor" stroke-width="1"/>
<text x="74" y="458" font-size="13" font-weight="600" text-anchor="start">engine.py 엔진</text>
<text x="74" y="476" font-size="11" text-anchor="start">today · ships: 지금 위치 → 판정 → 어종</text>
<text x="74" y="494" font-size="11" text-anchor="start">tick(실제 3초마다 확인): 지나간 10분 경계마다</text>
<text x="88" y="510" font-size="11" text-anchor="start">ships_pos · forecast · events 기록</text>
<text x="74" y="528" font-size="11" text-anchor="start">새 '입항 중' 배 묶음 → 알림(백그라운드)</text>
<text x="74" y="548" font-size="11" fill="#b9541a" text-anchor="start">실데이터가 24h 넘게 멈추면 예보·알림 중지</text>
<text x="74" y="568" font-size="10" fill="#6b7280" text-anchor="start">되감기 → reset 이벤트(알림함은 그 이후만)</text>
<rect x="425" y="436" width="350" height="150" rx="6" fill="#ffffff" stroke="currentColor" stroke-width="1.1"/>
<text x="439" y="458" font-size="13" font-weight="600" text-anchor="start">SQLite (VM 디스크, 재배포해도 유지)</text>
<text x="439" y="482" font-size="11" text-anchor="start">fleet · ships_pos · auction_stats</text>
<text x="439" y="500" font-size="11" text-anchor="start">forecast · subs · events</text>
<text x="439" y="524" font-size="10" fill="#6b7280" text-anchor="start">source 열로 live / sim 구분</text>
<text x="439" y="540" font-size="10" fill="#6b7280" text-anchor="start">스키마 정본 schema.sql (마이그레이션 도구 없음)</text>
<text x="439" y="556" font-size="10" fill="#6b7280" text-anchor="start">명부·실적은 기동 시 다시 채움, 교통은 저장 안 함</text>
<rect x="790" y="436" width="350" height="150" rx="6" fill="none" stroke="currentColor" stroke-width="1"/>
<text x="804" y="458" font-size="13" font-weight="600" text-anchor="start">agent/ 질문창 (tool calling)</text>
<rect x="804" y="466" width="322" height="24" rx="4" fill="none" stroke="#6b7280" stroke-width="0.8"/>
<text x="814" y="482" font-size="11" font-weight="600" text-anchor="start">tools.py</text>
<text x="877.6" y="482" font-size="11" fill="#6b7280" text-anchor="start">도구 6개: 예보·어종·교통·권장·과거 실적·알림</text>
<rect x="804" y="496" width="322" height="24" rx="4" fill="none" stroke="#6b7280" stroke-width="0.8"/>
<text x="814" y="512" font-size="11" font-weight="600" text-anchor="start">chat.py</text>
<text x="870.4" y="512" font-size="11" fill="#6b7280" text-anchor="start">SSE 스트리밍 · 이전 2개 질문 맥락</text>
<text x="804" y="540" font-size="10" fill="#0e7c7b" text-anchor="start">LLM 실패 → 간단 모드(낱말 규칙, 같은 도구)</text>
<text x="804" y="556" font-size="10" fill="#6b7280" text-anchor="start">숫자는 도구에서만 · 호출 제한(분당 8, 하루 400)</text>
<text x="804" y="572" font-size="10" fill="#6b7280" text-anchor="start">데이터 소스는 말하지 않음(화면 배지가 표시)</text>
<rect x="60" y="600" width="715" height="94" rx="6" fill="none" stroke="currentColor" stroke-width="1"/>
<text x="74" y="622" font-size="13" font-weight="600" text-anchor="start">api/ 라우트 (모두 /api/…)</text>
<text x="74" y="644" font-size="11" text-anchor="start">/today  /ships  /traffic/now  /visit  /place  /notifications  /chat (SSE)</text>
<text x="74" y="662" font-size="11" text-anchor="start">/push/key  /subscribe  /unsubscribe</text>
<text x="74" y="682" font-size="11" fill="#b9541a" text-anchor="start">관리자 토큰: /sim/state·play·pause·seek·feed  /push/test   ·   / ← Vite dist 정적 서빙</text>
<rect x="790" y="600" width="350" height="94" rx="6" fill="#ffffff" stroke="currentColor" stroke-width="1.1"/>
<text x="804" y="622" font-size="13" font-weight="600" text-anchor="start">push.py 웹 푸시 (VAPID)</text>
<text x="804" y="644" font-size="11" text-anchor="start">구독 조건(어종) 매칭 → 발송, 만료 구독 삭제</text>
<text x="804" y="662" font-size="11" text-anchor="start">발송 기록 = 화면 알림함(최근 5건)</text>
<text x="804" y="682" font-size="10" fill="#6b7280" text-anchor="start">제목 '배마중 · 구룡포 입항 예보'</text>
<rect x="40" y="740" width="1120" height="158" rx="8" fill="none" stroke="currentColor" stroke-width="1.2"/>
<text x="55" y="762" font-size="13" font-weight="600" text-anchor="start">Vite + React SPA (PWA) · 배마중</text>
<text x="1145" y="762" font-size="11" fill="#6b7280" text-anchor="end">구룡포 새벽 입항·어종 알림 · 갤럭시 크롬 · 폰 폭 우선 · One UI · 모드 구분 없이 한 화면</text>
<rect x="60" y="778" width="170" height="52" rx="5" fill="#ffffff" stroke="currentColor" stroke-width="1.1"/>
<text x="145" y="799" font-size="12" font-weight="600" text-anchor="middle">입항 지도 (카카오맵)</text>
<text x="145" y="816" font-size="10" fill="#6b7280" text-anchor="middle">들어오는 배 이동 · 입항 물결</text>
<rect x="240" y="778" width="170" height="52" rx="5" fill="#ffffff" stroke="currentColor" stroke-width="1.1"/>
<text x="325" y="799" font-size="12" font-weight="600" text-anchor="middle">알림</text>
<text x="325" y="816" font-size="10" fill="#6b7280" text-anchor="middle">알림 켜기 + 보낸 알림</text>
<rect x="420" y="778" width="170" height="52" rx="5" fill="#ffffff" stroke="currentColor" stroke-width="1.1"/>
<text x="505" y="799" font-size="12" font-weight="600" text-anchor="middle">오늘 입항 예보</text>
<text x="505" y="816" font-size="10" fill="#6b7280" text-anchor="middle">척별 ETA · 5척 + 더보기</text>
<rect x="600" y="778" width="170" height="52" rx="5" fill="#ffffff" stroke="currentColor" stroke-width="1.1"/>
<text x="685" y="799" font-size="12" font-weight="600" text-anchor="middle">오늘 뭐가 들어오나</text>
<text x="685" y="816" font-size="10" fill="#6b7280" text-anchor="middle">지금 들어오는 배 N척 기준</text>
<rect x="780" y="778" width="170" height="52" rx="5" fill="#ffffff" stroke="currentColor" stroke-width="1.1"/>
<text x="865" y="799" font-size="12" font-weight="600" text-anchor="middle">위판장 앞 지금</text>
<text x="865" y="816" font-size="10" fill="#6b7280" text-anchor="middle">실측 교통 · 도착 권장</text>
<rect x="960" y="778" width="170" height="52" rx="5" fill="#ffffff" stroke="currentColor" stroke-width="1.1"/>
<text x="1045" y="799" font-size="12" font-weight="600" text-anchor="middle">물어보기</text>
<text x="1045" y="816" font-size="10" fill="#6b7280" text-anchor="middle">조회 기록 · 최근 3개</text>
<text x="60" y="852" font-size="11" text-anchor="start">오른쪽 위 배지: 선박 위치 시뮬레이션 / 실시간 / 미갱신</text>
<text x="60" y="870" font-size="11" fill="#b9541a" text-anchor="start">?admin=1 → 진행 막대(관리자 토큰): 03:00·03:10·재생·일시정지·실데이터 전환·시험 알림</text>
<text x="60" y="888" font-size="10" fill="#6b7280" text-anchor="start">폰: 하단 바(알림 받기 · 물어보기) · 600px 이상 두 칸(42:58), 960px 이상 38:62</text>
