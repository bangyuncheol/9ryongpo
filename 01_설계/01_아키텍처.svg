<text x="55" y="220" font-size="13" font-weight="600" text-anchor="start">FastAPI 서버 · GCP VM</text>
<text x="1145" y="220" font-size="11" fill="#6b7280" text-anchor="end">systemd 상시 실행 · HTTPS: Caddy/터널</text>
